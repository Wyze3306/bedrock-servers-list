name: Regenerer la liste

on:
  push:
    branches: [main]
    paths: ["servers/**", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py
      - name: Commit des fichiers generes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.json servers.csv README.md
          git diff --cached --quiet || git commit -m "chore: regenerer servers.json, servers.csv et le README"
          git push
